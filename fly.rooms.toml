# fly.toml app configuration file generated for graphgame-rooms-curious-thunder-902 on 2026-11-23T13:14:25-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'graphgame-rooms-curious-thunder-902'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.rooms'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
